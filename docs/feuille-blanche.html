<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="robots" content="noindex">
  <title>Feuille blanche</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <style>
    :root {
      --bg: #f8fafc;
      --paper: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --paper: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --line: #334155;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header, footer {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .6rem 1rem;
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
      font-size: .85rem;
      color: var(--muted);
    }
    header { border-bottom: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); padding-bottom: max(.6rem, env(safe-area-inset-bottom)); }
    h1 { font-size: 1rem; margin: 0; color: var(--text); }
    a, button {
      color: var(--accent);
      background: none;
      border: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      padding: .25rem .4rem;
      border-radius: .4rem;
    }
    a:hover, button:hover { background: var(--line); }
    .spacer { flex: 1; }
    main { flex: 1; display: flex; min-height: 0; padding: 1rem; }
    textarea {
      flex: 1;
      width: 100%;
      max-width: 52rem;
      margin: 0 auto;
      resize: none;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--paper);
      color: var(--text);
      padding: 1.25rem;
      font: inherit;
      font-size: 1.05rem;
      line-height: 1.7;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>📝 Feuille blanche</h1>
    <span class="spacer"></span>
    <a href="index.html">← Retour à l'appli</a>
  </header>

  <main>
    <textarea id="page" autofocus spellcheck="true" aria-label="Feuille blanche"
              placeholder="Écris ici ce que tu veux…"></textarea>
  </main>

  <footer>
    <span id="count">0 mot · 0 caractère</span>
    <span id="status">Enregistré</span>
    <span class="spacer"></span>
    <button id="download" type="button">⬇️ Télécharger (.txt)</button>
  </footer>

  <script>
    (function () {
      var KEY = "campass.feuille-blanche";
      var page = document.getElementById("page");
      var count = document.getElementById("count");
      var status = document.getElementById("status");
      var timer = null;

      function load() {
        try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; }
      }
      function save() {
        try {
          localStorage.setItem(KEY, page.value);
          status.textContent = "Enregistré";
        } catch (e) {
          status.textContent = "⚠️ Enregistrement impossible sur ce navigateur";
        }
      }
      function updateCount() {
        var text = page.value.trim();
        var words = text ? text.split(/\s+/).length : 0;
        var chars = page.value.length;
        count.textContent = words + (words > 1 ? " mots" : " mot") + " · " +
                            chars + (chars > 1 ? " caractères" : " caractère");
      }

      page.value = load();
      updateCount();

      page.addEventListener("input", function () {
        updateCount();
        status.textContent = "Enregistrement…";
        clearTimeout(timer);
        timer = setTimeout(save, 400);
      });
      window.addEventListener("pagehide", save);

      document.getElementById("download").addEventListener("click", function () {
        var blob = new Blob([page.value], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "feuille-blanche.txt";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });
    })();
  </script>
</body>
</html>
